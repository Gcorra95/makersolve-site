<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata — MakerSolve</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --amber:#E8A020; --bg:#080C18; --text:#F0F2F8; --muted:#5A6480; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px; }
    .code { font-family:monospace; font-size:5rem; font-weight:800; color:var(--amber); line-height:1; margin-bottom:1rem; }
    h1 { font-size:1.5rem; margin-bottom:0.75rem; }
    p { color:var(--muted); margin-bottom:2rem; }
    a { display:inline-block; padding:12px 24px; background:var(--amber); color:var(--bg); font-weight:600; border-radius:4px; text-decoration:none; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata.</p>
    <a href="/">Torna alla home</a>
  </div>
</body>
</html>
